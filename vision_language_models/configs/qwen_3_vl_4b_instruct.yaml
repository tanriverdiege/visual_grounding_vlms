# Every argument the VLM constructor takes. Load with:
#
#   from config import VLMConfig
#   from vlm import HuggingFaceVLM
#
#   vlm = HuggingFaceVLM(VLMConfig.from_yaml("config.yaml"))
#
# Unknown keys are an error, not a warning -- a typo'd key here would
# otherwise be a setting that silently did not apply.

# --- model ---
# A HuggingFace model id.
model_name: Qwen/Qwen3-VL-4B-Instruct

# Device to place the model on: cpu, cuda, mps, or an indexed form such as
# cuda:1. Leave null to auto-detect (cuda -> mps -> cpu).
device: null

# --- image resolution ---
# Qwen-VL's processor uses dynamic resolution: an image becomes roughly
# (pixels / 28^2) tokens, with no cap by default (this model's own
# preprocessor_config.json allows up to ~16.7M pixels). A single large image
# -- a several-megapixel scan, for instance -- can turn into 10k+ tokens and
# OOM a 16 GB card on its own, well before model size is the bottleneck.
#
# max_pixels below was picked by empirically sweeping this exact model on this
# cluster's 16 GB Quadro RTX 5000, generating max_new_tokens=128 against a
# 13.2 MP worst-case test image (data/example_image5.png) at each step:
#
#   max_pixels   tokens   reserved VRAM
#   1,003,520      976     ~9-10 GB
#   2,744,000    2,616    13.59 GB   <- chosen: real headroom
#   3,136,000    3,040    15.00 GB      still fits, but only ~1.4 GB free
#   3,920,000+       -    OOM            hard wall, not a gradual slowdown
#
# 2,744,000 keeps ~2.5 GB of headroom for other image aspect ratios / overhead
# while giving ~2.7x the token budget (and therefore detail) of Qwen's stock
# VQA default. Still not validated for THIS project's grounding accuracy --
# small/closely-packed objects can still be lost at this budget. Re-run the
# sweep (see vlm.py conversation history / ask Claude to repeat it) if you
# change the model, the GPU, or need more resolution than this.
min_pixels: 200704  # 256 * 28 * 28
max_pixels: 2744000  # 3500 * 28 * 28

# --- generation ---
# true samples from the distribution; false takes the argmax at every step,
# false = greedy sampling, which is deterministic and what evaluation runs should use.
do_sample: false

# Cap on generated tokens.
max_new_tokens: 4096

# --- diagnostics ---
# Return a structured output from generate() instead of a bare tensor. Forced
# on automatically when either of the two below is true, since scores and
# logits are only reachable through the structured form.
return_dict_in_generate: true

# Per-step distributions *after* logits processors -- what sampling saw.
# Needed for VLMOutput.token_confidences() and .mean_confidence().
output_scores: false

# Per-step *raw* model outputs, before any processing.
output_logits: false

# --- prompting ---
# Key into prompts.PROMPTS -- see prompts.py for the template text. Used as
# run_grounding.py's default when its own prompt_template argument is null.
prompt_template: qwen_spine_vert_detection